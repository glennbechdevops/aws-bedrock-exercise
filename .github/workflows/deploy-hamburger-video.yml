name: Deploy hamburger video

on:
  push:
    branches:
      - main
    paths:
      - hamburger-video/**
      - .github/workflows/deploy-hamburger-video.yml

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  STACK_NAME: hamburger-video-sivert
  OUTPUT_BUCKET: ${{ vars.BURGER_VIDEO_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2

      - name: Build SAM application
        working-directory: hamburger-video
        run: sam build --use-container

      - name: Deploy SAM application
        working-directory: hamburger-video
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION" \
            --parameter-overrides OutputBucket="$OUTPUT_BUCKET" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset